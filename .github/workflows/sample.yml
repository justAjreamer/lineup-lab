name: sample sources
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python sample.py
      - run: |
          git config user.name "lineup-lab-relay"; git config user.email "lineup-lab-relay@users.noreply.github.com"
          git add samples; git diff --cached --quiet || git commit -m "source samples"; git pull --rebase -q; git push
