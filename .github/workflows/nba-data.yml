# Lineup Lab data relay: fetches official NBA.com data on GitHub's servers (open internet) and commits it,
# so Lineup Lab's sessions — which can reach GitHub but not NBA.com — can `git clone` it.
name: NBA data relay
on:
  # GitHub can skip or delay scheduled runs, so key windows get two slots. Times are UTC; Central is UTC-5 (CDT)
  # until Nov 1, then UTC-6 (CST). Every run catches up on anything a skipped run missed.
  schedule:
    - cron: "15 9 * * *"     # ~4 AM CDT / 3 AM CST: last night's box scores
    - cron: "10 13 * * *"    # ~8 AM CDT / 7 AM CST: second pass at overnight box scores
    - cron: "35 15 * * *"    # ~10:35 AM CDT / 9:35 AM CST: morning injury report, before the early-games run
    - cron: "40 20 * * *"    # ~3:40 PM CDT / 2:40 PM CST: afternoon report
    - cron: "25 21 * * *"    # ~4:25 PM CDT / 3:25 PM CST: last report before the main run
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: relay
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: fetch (output saved to data/2026-27/relay_log.txt so it can be read without Actions log access)
        id: fetch
        run: |
          set +e
          python nba_feed.py fetch --root data/2026-27 > data/2026-27/relay_log.txt 2>&1
          code=$?
          echo "exit=$code at $(date -u +%Y-%m-%dT%H:%MZ)" >> data/2026-27/relay_log.txt
          tail -40 data/2026-27/relay_log.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: commit new data (and the log, even when the fetch failed)
        run: |
          git config user.name "lineup-lab-relay"
          git config user.email "lineup-lab-relay@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "NBA data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: fail the run if the fetch failed (GitHub emails you)
        if: steps.fetch.outputs.code != '0'
        run: exit 1
