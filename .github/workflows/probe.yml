name: probe sources
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python probe.py
      - run: |
          git config user.name "lineup-lab-relay"; git config user.email "lineup-lab-relay@users.noreply.github.com"
          git add data/probe.json; git diff --cached --quiet || git commit -m "source probe"; git pull --rebase -q; git push
